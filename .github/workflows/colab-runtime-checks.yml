name: Colab runtime management

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r sys/requirements-dev.txt pytest
      - name: Install media inspection tools for WAV contract fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify account claims, recovery and dashboard contracts
        run: >-
          python -m pytest -q
          sys/tests/test_colab_scheduler.py sys/tests/test_colab_health.py
          sys/tests/test_colab_accounts.py sys/tests/test_colab_runtime_binding.py
          sys/tests/test_colab_tts.py sys/tests/test_remote_render.py
          sys/tests/test_colab_reconcile.py sys/tests/test_account_probe.py
          sys/tests/test_dashboard.py sys/tests/test_dashboard_engine.py
      - name: Lint scheduler and health implementation
        run: >-
          python -m pip install ruff && python -m ruff check
          sys/colab_bridge/scheduler.py sys/colab_bridge/health.py
          sys/colab_bridge/assignment_probe.py sys/tests/test_colab_scheduler.py
          sys/tests/test_colab_health.py
