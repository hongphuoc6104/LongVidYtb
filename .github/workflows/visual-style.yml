name: Repository contracts

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: python -m pip install -r sys/requirements-dev.txt pytest ruff
      - name: Install media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify style, compatibility and remote render contracts
        run: >-
          python -m pytest -q -m "not media_acceptance"
          sys/tests/test_colab_scheduler.py
          sys/tests/test_ci_envelope.py
          sys/tests/test_colab_health.py
          sys/tests/test_colab_accounts.py
          sys/tests/test_colab_tts.py
          sys/tests/test_flow_cdp_bridge.py
          sys/tests/test_flow_prompts.py
          sys/tests/test_flow_prompt_integration.py
          sys/tests/test_full_frame_pipeline.py
          sys/tests/test_full_frame_upgrade.py
          sys/tests/test_remote_render.py
          sys/tests/test_anti_formulaic_storytelling.py
          sys/tests/test_integration_recovery.py
      - name: Lint the new implementation
        run: >-
          python -m ruff check
          sys/visual_style.py sys/runtime_contract.py sys/tests/test_integration_recovery.py
